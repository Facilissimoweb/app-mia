<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="M. Teresa Rogani: design della comunicazione visiva, siti web su misura e consulenza digitale."
    />
    <meta name="theme-color" content="#0f131c" />
    <title>M. Teresa Rogani — Design &amp; Consulenza Digitale</title>
    <script>
      (function () {
        try {
          var scale = localStorage.getItem('mtrdesign-type-scale')
          if (scale === 'sm' || scale === 'md' || scale === 'lg') {
            document.documentElement.dataset.typeScale = scale
          }
        } catch (error) {}
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
